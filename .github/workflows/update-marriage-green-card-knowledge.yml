name: Update Marriage Green Card Knowledge

on:
  push:
    paths:
      - "automation/update_knowledge.py"
      - "automation/bulk_content.py"
      - "automation/sources.json"
      - ".github/workflows/update-marriage-green-card-knowledge.yml"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marriage-green-card-knowledge-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate publisher scripts
        run: python -m py_compile automation/update_knowledge.py automation/bulk_content.py

      - name: Check official sources and build base feed
        run: python automation/update_knowledge.py

      - name: Publish 30 cards in every content category
        run: python automation/bulk_content.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/knowledge-updates.json > /dev/null
          python -m json.tool data/daily-knowledge.json > /dev/null
          python -m json.tool data/knowledge-state.json > /dev/null

      - name: Commit the direct automatic website update
        run: |
          if git diff --quiet -- data/knowledge-updates.json data/knowledge-updates.js data/knowledge-state.json data/daily-knowledge.json; then
            echo "No generated changes detected."
            exit 0
          fi
          git config user.name "huarenhunlv-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/knowledge-updates.json data/knowledge-updates.js data/knowledge-state.json data/daily-knowledge.json
          git commit -m "Daily direct publish: 30 items per category $(date -u +%F)"
          git push
