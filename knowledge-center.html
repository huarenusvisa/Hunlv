<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="华人婚姻绿卡网自动内容中心：每天在婚绿知识、材料清单、模拟提交、成功案例和常见问题五个类目分别发布30条内容。" />
  <meta name="theme-color" content="#0d4b40" />
  <link rel="canonical" href="https://huarenhunlv.com/knowledge-center.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <title>自动内容中心｜华人婚姻绿卡网</title>
  <style>
    :root{--green:#0d4b40;--green2:#17685a;--gold:#dca64a;--cream:#fbf8f2;--line:#ead8b6;--ink:#173a35;--muted:#6d7c78;--white:#fff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans SC",sans-serif}.shell{width:min(1240px,calc(100% - 48px));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid #eee5d7}.top-inner{height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}.brand-mark{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:#bd8730;font-family:"Noto Serif SC",serif;font-size:20px}.brand strong{display:block;font-family:"Noto Serif SC",serif;font-size:20px}.brand small{display:block;color:#9a8362;letter-spacing:3px;margin-top:2px}.top-nav{display:flex;gap:18px;align-items:center}.top-nav a{color:var(--ink);text-decoration:none;font-weight:600}.home-btn{border:1px solid var(--line);border-radius:10px;padding:9px 15px}.hero{padding:30px 0 16px}.hero-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;background:linear-gradient(135deg,#fff 0%,#fffaf1 100%);border:1px solid var(--line);border-radius:22px;padding:26px 30px;box-shadow:0 14px 34px rgba(79,59,23,.06)}.eyebrow{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:#a86f1a;font-weight:700;font-size:13px}.hero h1{font-family:"Noto Serif SC",serif;font-size:clamp(34px,4vw,46px);line-height:1.15;margin:12px 0 8px}.hero p{font-size:15px;color:var(--muted);max-width:760px;line-height:1.7;margin:0}.stats{display:grid;grid-template-columns:repeat(3,118px);gap:10px}.stat{background:#f6fbf9;border:1px solid #dcebe6;border-radius:14px;padding:13px 14px;text-align:center}.stat strong{display:block;font-size:22px;color:var(--green);line-height:1.2}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.toolbar{padding:16px 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.search-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:13px}.search{width:min(430px,100%);border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:inherit}.count{color:var(--muted);font-size:14px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-bottom:54px}.card{min-width:0;min-height:250px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(65,48,20,.045);display:flex;flex-direction:column;gap:11px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(65,48,20,.09);border-color:#d9b977}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{max-width:78%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#edf7f4;color:var(--green);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.seq{flex:none;color:#9a8d76;font-size:12px}.card h2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-family:"Noto Serif SC",serif;font-size:19px;line-height:1.5;margin:0}.card p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;margin:0;color:#586d69;font-size:14px;line-height:1.7}.card-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed #e6d6b8;padding-top:11px}.more{border:0;background:transparent;color:var(--green);font:inherit;font-size:14px;font-weight:800;padding:0;cursor:pointer}.example{font-size:11px;color:#a16416;background:#fff4dd;padding:4px 7px;border-radius:7px}.source-note{font-size:11px;color:#9a8d76}.empty{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:42px;text-align:center;color:var(--muted)}.footer{border-top:1px solid #e8ddca;background:#0d3f37;color:#dcebe7;padding:26px 0}.footer p{margin:5px 0;line-height:1.7}.footer a{color:#fff}.error{background:#fff0ed;border:1px solid #f2b9ae;color:#8b3527;border-radius:14px;padding:16px;margin:24px 0}.hidden{display:none!important}
    .modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(9,31,27,.58);backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-panel{position:relative;width:min(720px,100%);max-height:min(82vh,760px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 28px 80px rgba(0,0,0,.22)}.modal-close{position:absolute;right:18px;top:16px;width:36px;height:36px;border:1px solid #e6d6b8;border-radius:50%;background:#fff;color:var(--ink);font-size:23px;line-height:1;cursor:pointer}.detail-meta{display:flex;align-items:center;gap:10px;padding-right:46px}.detail-meta .badge{max-width:none}.detail-title{font-family:"Noto Serif SC",serif;font-size:30px;line-height:1.45;margin:18px 0 12px}.detail-summary{color:#4f6661;font-size:16px;line-height:1.85;margin:0}.detail-points{margin:20px 0;padding:18px 20px 18px 38px;background:#f6fbf9;border:1px solid #dcebe6;border-radius:16px}.detail-points li{margin:9px 0;line-height:1.7}.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px dashed #e3d2b2;padding-top:18px}.official-link{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}.detail-note{font-size:12px;color:#887860;line-height:1.6}
    @media(max-width:1050px){.hero-card{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:780px){.shell{width:min(100% - 20px,1240px)}.top-inner{height:auto;padding:13px 0;align-items:flex-start}.top-nav{gap:10px;font-size:14px}.hero{padding-top:18px}.hero-card{padding:22px 18px;border-radius:18px}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search-row{align-items:stretch;flex-direction:column}.brand small{display:none}.modal{padding:12px}.modal-panel{padding:24px 20px;border-radius:20px}.detail-title{font-size:25px}.detail-actions{align-items:stretch;flex-direction:column}.official-link{width:100%}}
    @media(max-width:520px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:220px}.hero h1{font-size:34px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <a class="brand" href="index.html"><span class="brand-mark">缘</span><span><strong>华人婚姻绿卡网</strong><small>专业 · 高效 · 安心</small></span></a>
      <nav class="top-nav"><a href="index.html" class="home-btn">返回首页</a><a href="user-center.html">用户中心</a></nav>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-card">
        <div><span class="eyebrow">自动更新 · 直接发布</span><h1>婚绿自动内容中心</h1><p>每天为五个类目分别发布30条知识内容。列表仅展示知识卡片摘要，点击卡片或“查看更多”查看完整说明、要点和官方核对入口。</p></div>
        <div class="stats"><div class="stat"><strong id="dailyTotal">150</strong><span>今日自动发布</span></div><div class="stat"><strong>30</strong><span>每个类目</span></div><div class="stat"><strong id="lastUpdated">正在读取</strong><span>最后更新时间</span></div></div>
      </div>
    </section>

    <section class="toolbar" aria-label="内容筛选">
      <div class="tabs" id="tabs"></div>
      <div class="search-row"><input class="search" id="searchInput" type="search" placeholder="搜索标题、摘要或要点" aria-label="搜索内容" /><div class="count" id="resultCount">正在加载内容</div></div>
    </section>

    <div id="loadError" class="error hidden"></div>
    <section class="grid" id="contentGrid" aria-live="polite"></section>
  </main>

  <footer class="footer"><div class="shell"><p><strong>华人婚姻绿卡网</strong></p><p>自动发布不等于个案法律审查。涉及非法入境、身份逾期、刑事记录、递解程序、欺诈指控或其他复杂问题，请咨询美国持牌律师。</p><p>© 2026 华人婚姻绿卡网 · <a href="index.html">返回首页</a></p></div></footer>

  <div class="modal" id="detailModal" aria-hidden="true"><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button class="modal-close" id="detailClose" aria-label="关闭">×</button><div id="detailBody"></div></div></div>

  <script src="data/knowledge-updates.js"></script>
  <script>
    (() => {
      const categories = ['婚绿知识','材料清单','模拟提交','成功案例','常见问题'];
      const payload = window.HUNLV_KNOWLEDGE_UPDATES || {};
      const cards = Array.isArray(payload.daily_features) ? payload.daily_features : (payload.daily_feature ? [payload.daily_feature] : []);
      const params = new URLSearchParams(location.search);
      let current = categories.includes(params.get('category')) ? params.get('category') : categories[0];
      let query = '';
      const tabs = document.getElementById('tabs');
      const grid = document.getElementById('contentGrid');
      const count = document.getElementById('resultCount');
      const search = document.getElementById('searchInput');
      const error = document.getElementById('loadError');
      const modal = document.getElementById('detailModal');
      const detailBody = document.getElementById('detailBody');
      const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

      document.getElementById('dailyTotal').textContent = payload.daily_count || cards.length || 0;
      document.getElementById('lastUpdated').textContent = payload.generated_at ? new Date(payload.generated_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '暂无数据';

      const openDetail = card => {
        detailBody.innerHTML = `<div class="detail-meta"><span class="badge">${escapeHtml(card.category)} · ${escapeHtml(card.sub_category || '婚绿专题')}</span><span class="seq">第 ${escapeHtml(card.sequence || '')} 条</span></div><h2 class="detail-title" id="detailTitle">${escapeHtml(card.title)}</h2><p class="detail-summary">${escapeHtml(card.summary)}</p><ul class="detail-points">${(card.key_points || []).map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ul><div class="detail-actions"><div class="detail-note">${card.example_only ? '教学示例，非真实客户个案。' : '一般知识说明，不构成针对个人案件的法律意见。'}</div><a class="official-link" href="${escapeHtml(card.official_url || '#')}" target="_blank" rel="noopener noreferrer">查看官方来源 →</a></div>`;
        modal.classList.add('show');
        modal.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden';
      };
      const closeDetail = () => {modal.classList.remove('show');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';};

      const renderTabs = () => {
        tabs.innerHTML = categories.map(category => {
          const categoryCount = cards.filter(card => card.category === category).length;
          return `<button class="tab ${category === current ? 'active' : ''}" data-category="${category}">${category} ${categoryCount}</button>`;
        }).join('');
        tabs.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => {
          current = button.dataset.category;
          const url = new URL(location.href);
          url.searchParams.set('category', current);
          history.replaceState({}, '', url);
          renderTabs();
          renderCards();
        }));
      };

      const renderCards = () => {
        const normalized = query.trim().toLowerCase();
        const visible = cards.filter(card => {
          if (card.category !== current) return false;
          if (!normalized) return true;
          return [card.title, card.summary, ...(card.key_points || [])].join(' ').toLowerCase().includes(normalized);
        });
        count.textContent = `${current}：显示 ${visible.length} 条`;
        if (!visible.length) {grid.innerHTML = '<div class="empty">当前筛选条件下没有内容。</div>';return;}
        grid.innerHTML = visible.map(card => `<article class="card" tabindex="0" role="button" data-card-id="${escapeHtml(card.id)}" aria-label="查看：${escapeHtml(card.title)}"><div class="meta"><span class="badge">${escapeHtml(card.category)} · ${escapeHtml(card.sub_category || '婚绿专题')}</span><span class="seq">第 ${escapeHtml(card.sequence || '')} 条</span></div><h2>${escapeHtml(card.title)}</h2><p>${escapeHtml(card.summary)}</p><div class="card-bottom"><span>${card.example_only ? '<span class="example">教学示例</span>' : '<span class="source-note">知识卡片</span>'}</span><button class="more" type="button">查看更多 →</button></div></article>`).join('');
        grid.querySelectorAll('[data-card-id]').forEach(element => {
          const card = cards.find(item => item.id === element.dataset.cardId);
          if (!card) return;
          element.addEventListener('click', () => openDetail(card));
          element.addEventListener('keydown', event => {if (event.key === 'Enter' || event.key === ' ') {event.preventDefault();openDetail(card);}});
        });
      };

      if (!cards.length) {error.classList.remove('hidden');error.textContent = '自动内容数据尚未生成。系统将在本次部署完成后写入今日150条内容。';}
      search.addEventListener('input', event => {query = event.target.value;renderCards();});
      document.getElementById('detailClose').addEventListener('click', closeDetail);
      modal.addEventListener('click', event => {if (event.target === modal) closeDetail();});
      document.addEventListener('keydown', event => {if (event.key === 'Escape') closeDetail();});
      renderTabs();
      renderCards();
    })();
  </script>
</body>
</html>
