<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="自动汇总USCIS、美国国务院和Federal Register婚姻绿卡相关官方更新。">
  <title>婚姻绿卡官方更新｜华人婚姻绿卡网</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .updates-shell{width:min(1180px,calc(100% - 40px));margin:42px auto 90px}
    .updates-hero{padding:42px;border:1px solid #e8e1d6;border-radius:26px;background:#fffdf9}
    .updates-hero h1{font-family:"Noto Serif SC",serif;font-size:clamp(36px,5vw,58px);margin:10px 0 16px;color:#103f38}
    .updates-hero p{max-width:820px;line-height:1.85;color:#63736e}
    .updates-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .updates-meta span,.update-tag{padding:7px 11px;border-radius:999px;background:#eef5f2;color:#126454;font-size:12px}
    .updates-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}
    .updates-toolbar input,.updates-toolbar select{border:1px solid #ded8ce;border-radius:12px;padding:12px 14px;background:#fff;min-height:46px}
    .updates-toolbar input{flex:1;min-width:240px}
    .updates-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .update-card{border:1px solid #e8e1d6;border-radius:18px;padding:22px;background:#fff}
    .update-card h2{font-size:20px;line-height:1.5;margin:12px 0}
    .update-card p{color:#6d7975;line-height:1.75;font-size:14px}
    .update-card a{display:inline-flex;margin-top:12px;color:#126454;font-weight:700}
    .updates-empty{padding:46px;text-align:center;border:1px dashed #d8d0c3;border-radius:18px;color:#74817d}
    .updates-disclaimer{margin-top:28px;padding:18px 20px;border-left:4px solid #caa86a;background:#fbf7ef;color:#756b59;line-height:1.75}
    @media(max-width:760px){.updates-shell{width:calc(100% - 24px);margin-top:18px}.updates-hero{padding:26px}.updates-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">缘</span><span><strong>华人婚姻绿卡网</strong><small>专业 · 高效 · 安心</small></span></a>
      <nav class="main-nav"><a href="index.html">首页</a><a href="index.html#knowledge">婚绿知识</a><a class="active" href="knowledge-updates.html">官方更新</a><a href="index.html#simulation">模拟提交</a><a href="index.html#community">交友社区</a></nav>
    </header>
    <main class="updates-shell">
      <section class="updates-hero">
        <span class="section-kicker">官方信息自动更新</span>
        <h1>婚姻绿卡知识更新中心</h1>
        <p>系统每天检查USCIS、美国国务院签证公告和Federal Register等美国政府来源，筛选与配偶移民、I-130、I-485、I-751、F2A、CR1和IR1相关的信息，并保留原文入口供核对。</p>
        <div class="updates-meta"><span id="lastUpdated">等待首次自动更新</span><span id="itemCount">0 条信息</span><span>仅收录官方来源</span></div>
      </section>
      <div class="updates-toolbar">
        <input id="searchInput" type="search" placeholder="搜索：I-130、I-485、F2A、体检、排期……" aria-label="搜索更新">
        <select id="sourceFilter" aria-label="筛选来源"><option value="all">全部来源</option></select>
        <select id="typeFilter" aria-label="筛选类型"><option value="all">全部类型</option></select>
      </div>
      <section class="updates-grid" id="updatesGrid" aria-live="polite"></section>
      <div class="updates-disclaimer" id="disclaimer"></div>
    </main>
  </div>
  <script src="data/knowledge-updates.js"></script>
  <script>
    (()=>{
      const data=window.HUNLV_KNOWLEDGE_UPDATES||{items:[]};
      const grid=document.getElementById('updatesGrid');
      const search=document.getElementById('searchInput');
      const sourceFilter=document.getElementById('sourceFilter');
      const typeFilter=document.getElementById('typeFilter');
      const items=Array.isArray(data.items)?data.items:[];
      document.getElementById('itemCount').textContent=`${items.length} 条信息`;
      document.getElementById('lastUpdated').textContent=data.generated_at?`最近检查：${new Date(data.generated_at).toLocaleString('zh-CN')}`:'等待首次自动更新';
      document.getElementById('disclaimer').textContent=data.disclaimer||'仅供一般信息参考，不构成法律意见。';
      [...new Set(items.map(x=>x.source).filter(Boolean))].sort().forEach(value=>sourceFilter.insertAdjacentHTML('beforeend',`<option value="${value}">${value}</option>`));
      [...new Set(items.map(x=>x.source_type).filter(Boolean))].sort().forEach(value=>typeFilter.insertAdjacentHTML('beforeend',`<option value="${value}">${value}</option>`));
      function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
      function render(){
        const term=search.value.trim().toLowerCase();
        const source=sourceFilter.value;
        const type=typeFilter.value;
        const filtered=items.filter(item=>{
          const haystack=`${item.title||''} ${item.summary||''} ${item.source||''}`.toLowerCase();
          return (!term||haystack.includes(term))&&(source==='all'||item.source===source)&&(type==='all'||item.source_type===type);
        });
        if(!filtered.length){grid.innerHTML='<div class="updates-empty">当前没有匹配内容。自动任务首次运行后，这里会显示官方更新。</div>';return;}
        grid.innerHTML=filtered.map(item=>`<article class="update-card"><div><span class="update-tag">${escapeHtml(item.source)}</span> <span class="update-tag">${escapeHtml(item.source_type)}</span></div><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.summary||'请打开美国政府原文核对完整内容。')}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">查看官方原文 →</a></article>`).join('');
      }
      search.addEventListener('input',render);sourceFilter.addEventListener('change',render);typeFilter.addEventListener('change',render);render();
    })();
  </script>
</body>
</html>
