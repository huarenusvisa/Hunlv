<main class="user-shell"><section class="request-card"><h1>举报用户资料</h1><p>用于举报冒用照片、虚假身份、诈骗、骚扰、付费婚姻交易、未成年人资料或其他违反社区规则的内容。</p>
<form name="community-profile-report" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="request-card" style="border:0;padding:0;margin:0;box-shadow:none">
<input type="hidden" name="form-name" value="community-profile-report"><p class="hidden-field"><label>请勿填写<input name="bot-field"></label></p>
<label>被举报资料编号或页面地址<input type="text" name="profile_reference" required></label><label>举报类型<select name="report_type" required><option value="">请选择</option><option>冒用他人身份或照片</option><option>诈骗或索要钱款</option><option>付费结婚或身份交易</option><option>骚扰、威胁或仇恨内容</option><option>疑似未成年人</option><option>发布敏感个人信息</option><option>其他</option></select></label><label>情况说明<textarea name="details" rows="6" maxlength="1500" required></textarea></label><label>您的联系邮箱<input type="email" name="reporter_email" required></label>
<div class="legal-note">紧急危险请直接联系当地执法机构。本表格不提供紧急响应。我们会限制举报信息的访问范围，但可能依法向相关机构提供必要信息。</div><button class="primary-action" type="submit">提交举报</button></form></section></main></body></html>
